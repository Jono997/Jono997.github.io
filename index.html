<!DOCTYPE html><html>
    <head>
        <title>Page title here - Jono99</title>
        <link rel="stylesheet" href="common.css">
        <script src="common.js" defer></script>
    </head>
    <body>
        <main>
            Contents here
        </main>
        <div id="settings-container">
            <div id="settings-menu-container">
                <h2 style="text-align: center;">Settings</h2>
                <div id="settings-menu">
                    <h3>Theme</h3>
                    <div class="dropdown" dropdown-id="theme" ondropdownchange="alertDropdownValue">
                        <span class="dropdown-button">Light (default)</span>
                        <div class="dropdown-options">
                            <div dropdown-value="light">Light (default)</div>
                            <div dropdown-value="dark">Dark</div>
                            <div dropdown-value="solarised-light">Solarised Light</div>
                            <div dropdown-value="solarised-dark">Solarised Dark</div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="settings-button" onclick="toggleSettingsMenu()">Settings</div>
        </div>
    </body>
</html>
